<!DOCTYPE html>
<html lang="en">

<head>

    <title>Virtual Stock Trading - Registration</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;

            background:
                linear-gradient(
                    135deg,
                    rgb(136, 10, 194),
                    rgb(65, 20, 100)
                );

            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .main-container {
            width: 95%;
            max-width: 1150px;

            display: flex;
            align-items: center;
            justify-content: center;

            gap: 60px;
        }

        .image-container {
            width: 52%;
            text-align: center;
        }

        .registration-image {
            width: 100%;
            max-width: 550px;
            border-radius: 15px;
        }

        .register-container {
            width: 480px;

            background-color: white;

            border-radius: 15px;

            padding: 40px;

            text-align: center;

            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .register-container h1 {
            color: rgb(136, 10, 194);
            margin-bottom: 12px;
            font-size: 28px;
        }

        .register-container p {
            color: gray;
            margin-bottom: 20px;
            font-size: 17px;
        }

        /* Role tags */

        .role-tags {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .role-tag {
            padding: 9px 14px;

            border-radius: 20px;

            border: 1px solid
                rgb(136, 10, 194);

            background-color: white;

            color:
                rgb(136, 10, 194);

            cursor: pointer;

            font-size: 14px;
        }

        .role-tag.active {
            background-color:
                rgb(136, 10, 194);

            color: white;
        }

        input {
            width: 100%;

            padding: 14px;

            margin-top: 14px;

            border: 1px solid black;

            border-radius: 6px;

            font-size: 16px;
        }

        button.register-button {
            width: 160px;

            padding: 13px;

            margin-top: 22px;

            background-color:
                rgb(114, 10, 205);

            color: white;

            border: 1px solid black;

            border-radius: 6px;

            cursor: pointer;

            font-size: 17px;
        }

        button.register-button:hover {
            background-color:
                rgb(100, 5, 180);
        }

        .error {
            display: block;

            color: red;

            margin-top: 5px;

            font-size: 13px;

            text-align: left;
        }

        .login-link {
            display: block;

            margin-top: 20px;

            text-decoration: none;

            color:
                rgb(136, 10, 194);
        }

        @media (max-width: 800px) {

            .main-container {
                flex-direction: column;
                gap: 20px;
                padding: 20px;
            }

            .image-container {
                width: 90%;
            }

            .register-container {
                width: 100%;
                max-width: 480px;
            }

            .role-tags {
                flex-wrap: wrap;
            }
        }

    </style>

</head>


<body>


<div class="main-container">


    <!-- Image -->

    <div class="image-container">

        <img
            src="registration image.png"
            class="registration-image"
            alt="Registration Image">

    </div>


    <!-- Registration -->

    <div class="register-container">

        <h1>
            Virtual Stock Trading
        </h1>

        <p>
            Create your account
        </p>


        <!-- Role Tags -->

        <div class="role-tags">

            <button
                type="button"
                class="role-tag active"
                id="userRole"
                onclick="selectRole('User')">

                User

            </button>


            <button
                type="button"
                class="role-tag"
                id="adminRole"
                onclick="openAdminLogin()">

                Admin

            </button>


            <button
                type="button"
                class="role-tag"
                id="stockRole"
                onclick="openStockManagerLogin()">

                Stock Manager

            </button>

        </div>


        <p id="selectedRole">
            Selected Role: User
        </p>


        <form onsubmit="return validate()">


            <!-- Username -->

            <input
                type="text"
                id="username"
                placeholder="Enter Username">

            <span
                id="usererror"
                class="error">
            </span>


            <!-- Email -->

            <input
                type="email"
                id="email"
                placeholder="Enter Email">

            <span
                id="emailerror"
                class="error">
            </span>


            <!-- Password -->

            <input
                type="password"
                id="password"
                placeholder="Enter Password">

            <span
                id="passworderror"
                class="error">
            </span>


            <!-- Confirm Password -->

            <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm Password">

            <span
                id="confirmPassworderror"
                class="error">
            </span>


            <button
                type="submit"
                class="register-button">

                Register

            </button>

        </form>


        <a
            href="loginpage.html"
            class="login-link">

            Already have an account? Login

        </a>

    </div>

</div>


<script>

/* ===============================
   STORE FIXED ADMIN CREDENTIALS
================================ */

var adminDetails = {

    username: "Sriman",

    password: "2500032369"
};


localStorage.setItem(
    "adminDetails",
    JSON.stringify(adminDetails)
);


/* ===============================
   STORE FIXED STOCK MANAGER
================================ */

var stockManagerDetails = {

    username: "2500032369",

    password: "250459491"
};


localStorage.setItem(
    "stockManagerDetails",
    JSON.stringify(stockManagerDetails)
);


/* ===============================
   SELECT USER ROLE
================================ */

function selectRole(role) {

    document.getElementById(
        "userRole"
    ).classList.add("active");

    document.getElementById(
        "adminRole"
    ).classList.remove("active");

    document.getElementById(
        "stockRole"
    ).classList.remove("active");


    document.getElementById(
        "selectedRole"
    ).innerHTML =
        "Selected Role: " + role;

}


/* ===============================
   ADMIN LOGIN
================================ */

function openAdminLogin() {

    window.location.href =
        "adminlogin.html";

}


/* ===============================
   STOCK MANAGER LOGIN
================================ */

function openStockManagerLogin() {

    window.location.href =
        "stockmanagerlogin.html";

}


/* ===============================
   USER REGISTRATION
================================ */

function validate() {

    var username =
        document.getElementById(
            "username"
        ).value.trim();


    var email =
        document.getElementById(
            "email"
        ).value.trim();


    var password =
        document.getElementById(
            "password"
        ).value;


    var confirmPassword =
        document.getElementById(
            "confirmPassword"
        ).value;


    var usererror =
        document.getElementById(
            "usererror"
        );


    var emailerror =
        document.getElementById(
            "emailerror"
        );


    var passworderror =
        document.getElementById(
            "passworderror"
        );


    var confirmPassworderror =
        document.getElementById(
            "confirmPassworderror"
        );


    usererror.innerHTML = "";

    emailerror.innerHTML = "";

    passworderror.innerHTML = "";

    confirmPassworderror.innerHTML = "";


    var valid = true;


    /* Username */

    if (username === "") {

        usererror.innerHTML =
            "Enter the username";

        valid = false;
    }


    /* Email */

    if (email === "") {

        emailerror.innerHTML =
            "Enter email";

        valid = false;
    }


    /* Password */

    if (password.length < 8) {

        passworderror.innerHTML =
            "Password should contain at least 8 characters";

        valid = false;

    }

    else if (!password.match(/[0-9]/)) {

        passworderror.innerHTML =
            "Password should contain at least one number";

        valid = false;
    }


    /* Confirm password */

    if (confirmPassword === "") {

        confirmPassworderror.innerHTML =
            "Confirm your password";

        valid = false;

    }

    else if (password !== confirmPassword) {

        confirmPassworderror.innerHTML =
            "Passwords do not match";

        valid = false;
    }


    if (!valid) {

        return false;
    }


    /* Get existing users */

    var users =
        JSON.parse(
            localStorage.getItem("users")
        ) || [];


    /* Check duplicate username */

    var usernameExists =
        users.some(function(user) {

            return user.username === username;

        });


    if (usernameExists) {

        usererror.innerHTML =
            "Username already exists.";

        return false;
    }


    /* Check duplicate email */

    var emailExists =
        users.some(function(user) {

            return user.email === email;

        });


    if (emailExists) {

        emailerror.innerHTML =
            "Email already exists.";

        return false;
    }


    /* Create user */

    var newUser = {

        username: username,

        email: email,

        password: password
    };


    users.push(newUser);


    /* Store all users */

    localStorage.setItem(
        "users",
        JSON.stringify(users)
    );


    alert(
        "User account registered successfully."
    );


    window.location.href =
        "loginpage.html";


    return false;

}

</script>


</body>

</html>
