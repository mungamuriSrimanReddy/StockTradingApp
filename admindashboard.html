<!DOCTYPE html>
<html lang="en">

<head>

    <title>Virtual Stock Trading - Admin Dashboard</title>

    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            font-family: Arial, sans-serif;

            background:
                linear-gradient(
                    135deg,
                    rgb(136, 10, 194),
                    rgb(65, 20, 100)
                );

            min-height: 100vh;

            color: white;
        }


        /* ================= NAVBAR ================= */

        .navbar {

            min-height: 75px;

            background-color:
                rgb(25, 18, 35);

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 0 30px;
        }


        .logo {

            width: 48px;

            height: 48px;

            display: flex;

            align-items: center;

            justify-content: center;

            background-color:
                rgb(136, 10, 194);

            border-radius: 12px;

            font-size: 20px;

            font-weight: bold;
        }


        .navbar h2 {

            margin: 0;

            font-size: 21px;
        }


        .logout {

            background-color:
                rgb(136, 10, 194);

            color: white;

            border: none;

            padding: 11px 20px;

            border-radius: 7px;

            cursor: pointer;

            font-size: 15px;
        }


        .logout:hover {

            background-color:
                rgb(105, 7, 150);
        }


        /* ================= MAIN ================= */

        .admin-container {

            width: 92%;

            max-width: 1200px;

            margin: 30px auto;

            padding: 35px;

            background:
                rgba(255, 255, 255, 0.08);

            border-radius: 18px;
        }


        .admin-container h1 {

            margin-top: 0;

            margin-bottom: 8px;
        }


        .subtitle {

            color:
                rgb(220, 210, 230);

            margin-bottom: 30px;
        }


        /* ================= CARDS ================= */

        .summary {

            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 20px;

            margin-bottom: 30px;
        }


        .summary-card {

            background:
                rgba(255, 255, 255, 0.12);

            border:
                1px solid
                rgba(255, 255, 255, 0.15);

            border-radius: 14px;

            padding: 25px;

            text-align: center;
        }


        .summary-card h3 {

            margin-top: 0;

            font-size: 17px;
        }


        .summary-card p {

            font-size: 30px;

            font-weight: bold;

            margin: 10px 0 0;

            color:
                rgb(225, 180, 255);
        }


        /* ================= SECTION ================= */

        .section {

            background-color: white;

            color:
                rgb(45, 28, 70);

            border-radius: 14px;

            padding: 25px;

            margin-top: 25px;
        }


        .section h2 {

            margin-top: 0;
        }


        /* ================= TABLE ================= */

        table {

            width: 100%;

            border-collapse: collapse;

            margin-top: 15px;
        }


        th {

            background-color:
                rgb(136, 10, 194);

            color: white;

            padding: 14px;

            text-align: left;
        }


        td {

            padding: 13px;

            border-bottom:
                1px solid
                rgb(225, 215, 230);
        }


        /* ================= BUTTONS ================= */

        .actions {

            display: flex;

            flex-wrap: wrap;

            gap: 15px;
        }


        .action-button {

            background-color:
                rgb(136, 10, 194);

            color: white;

            border: none;

            padding: 13px 20px;

            border-radius: 7px;

            cursor: pointer;

            font-size: 15px;
        }


        .action-button:hover {

            background-color:
                rgb(105, 7, 150);
        }


        .danger-button {

            background-color:
                rgb(190, 50, 50);
        }


        .danger-button:hover {

            background-color:
                rgb(150, 35, 35);
        }


        @media (max-width: 800px) {

            .summary {

                grid-template-columns: 1fr;
            }


            .admin-container {

                width: 95%;

                padding: 20px;
            }


            .navbar {

                padding: 0 15px;
            }

        }

    </style>

</head>


<body>


<!-- ================= NAVBAR ================= -->

<!-- ================= NAVBAR ================= -->

<div class="navbar">

    <div class="logo">
        <img src="logo.png" alt="Virtual Stock Trading Logo">
    </div>

    <h2>
        Admin Dashboard
    </h2>

    <button
        class="logout"
        onclick="logout()">

        Logout

    </button>

</div>


<!-- ================= MAIN ================= -->

<div class="admin-container">


    <h1>
        Admin Dashboard
    </h1>


    <p class="subtitle">

        Manage users and monitor the Virtual Stock Trading system.

    </p>


    <!-- ================= SUMMARY ================= -->

    <div class="summary">


        <div class="summary-card">

            <h3>
                Registered Users
            </h3>

            <p id="userCount">
                0
            </p>

        </div>


        <div class="summary-card">

            <h3>
                Managed Stocks
            </h3>

            <p id="stockCount">
                0
            </p>

        </div>


        <div class="summary-card">

            <h3>
                System Status
            </h3>

            <p style="font-size: 22px;">
                Active
            </p>

        </div>

    </div>


    <!-- ================= USERS ================= -->

    <div class="section">

        <h2>
            Registered Users
        </h2>


        <table>

            <thead>

                <tr>

                    <th>
                        S.No
                    </th>

                    <th>
                        Username
                    </th>

                    <th>
                        Email
                    </th>

                    <th>
                        Role
                    </th>

                </tr>

            </thead>


            <tbody id="userTable">

            </tbody>

        </table>

    </div>


    <!-- ================= STOCK SUMMARY ================= -->

    <div class="section">

        <h2>
            Managed Stocks
        </h2>


        <table>

            <thead>

                <tr>

                    <th>
                        S.No
                    </th>

                    <th>
                        Stock Name
                    </th>

                    <th>
                        Price
                    </th>

                </tr>

            </thead>


            <tbody id="stockTable">

            </tbody>

        </table>

    </div>


    <!-- ================= ADMIN CONTROLS ================= -->

    <div class="section">

        <h2>
            Admin Controls
        </h2>


        <div class="actions">


            <button
                class="action-button"
                onclick="window.location.href='stockmanagerdashboard.html'">

                Open Stock Manager

            </button>


            <button
                class="action-button"
                onclick="refreshData()">

                Refresh Data

            </button>


            <button
                class="action-button danger-button"
                onclick="clearUsers()">

                Clear Registered Users

            </button>


        </div>

    </div>

</div>


<script src="script.js"></script>

<script>

loadUsers();

loadStocks();

</script>



</body>

</html>
