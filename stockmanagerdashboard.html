<!DOCTYPE html>
<html lang="en">

<head>

    <title>Virtual Stock Trading - Stock Manager</title>

    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            font-family: Arial, sans-serif;

            background:
                linear-gradient(
                    135deg,
                    rgb(136, 10, 194),
                    rgb(65, 20, 100)
                );

            min-height: 100vh;

            color: white;
        }


        /* ================= NAVBAR ================= */

        .navbar {

            min-height: 75px;

            background-color:
                rgb(25, 18, 35);

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 0 30px;
        }


        .logo {

            width: 48px;

            height: 48px;

            display: flex;

            align-items: center;

            justify-content: center;

            background-color:
                rgb(136, 10, 194);

            border-radius: 12px;

            font-size: 20px;

            font-weight: bold;
        }


        .navbar h2 {

            margin: 0;

            font-size: 21px;
        }


        .logout {

            background-color:
                rgb(136, 10, 194);

            color: white;

            border: none;

            padding: 11px 20px;

            border-radius: 7px;

            cursor: pointer;

            font-size: 15px;
        }


        .logout:hover {

            background-color:
                rgb(105, 7, 150);
        }


        /* ================= MAIN ================= */

        .manager-container {

            width: 92%;

            max-width: 1200px;

            margin: 30px auto;

            padding: 35px;

            background:
                rgba(255, 255, 255, 0.08);

            border-radius: 18px;
        }


        .manager-container h1 {

            margin-top: 0;
        }


        .subtitle {

            color:
                rgb(220, 210, 230);

            margin-bottom: 30px;
        }


        /* ================= ADD STOCK ================= */

        .add-stock {

            background-color: white;

            color:
                rgb(45, 28, 70);

            padding: 25px;

            border-radius: 14px;

            margin-bottom: 30px;
        }


        .add-stock h2 {

            margin-top: 0;
        }


        .form-container {

            display: grid;

            grid-template-columns:
                1fr 1fr 150px;

            gap: 15px;

            align-items: end;
        }


        .form-group label {

            display: block;

            margin-bottom: 7px;

            font-weight: bold;
        }


        .form-group input {

            width: 100%;

            padding: 12px;

            border: 1px solid
                rgb(100, 90, 110);

            border-radius: 6px;

            font-size: 15px;
        }


        .add-button {

            padding: 12px;

            background-color:
                rgb(136, 10, 194);

            color: white;

            border: none;

            border-radius: 7px;

            cursor: pointer;

            font-size: 15px;
        }


        .add-button:hover {

            background-color:
                rgb(105, 7, 150);
        }


        /* ================= TABLE ================= */

        .stock-table {

            background-color: white;

            color:
                rgb(45, 28, 70);

            padding: 25px;

            border-radius: 14px;
        }


        .stock-table h2 {

            margin-top: 0;
        }


        table {

            width: 100%;

            border-collapse: collapse;

            margin-top: 15px;
        }


        th {

            background-color:
                rgb(136, 10, 194);

            color: white;

            padding: 14px;

            text-align: left;
        }


        td {

            padding: 13px;

            border-bottom:
                1px solid
                rgb(225, 215, 230);
        }


        td input {

            width: 110px;

            padding: 8px;

            border: 1px solid gray;

            border-radius: 5px;
        }


        .update-button {

            background-color:
                rgb(40, 150, 90);

            color: white;

            border: none;

            padding: 8px 12px;

            border-radius: 5px;

            cursor: pointer;
        }


        .delete-button {

            background-color:
                rgb(190, 50, 50);

            color: white;

            border: none;

            padding: 8px 12px;

            border-radius: 5px;

            cursor: pointer;

            margin-left: 5px;
        }


        .back-button {

            background-color:
                white;

            color:
                rgb(136, 10, 194);

            border: 1px solid
                rgb(136, 10, 194);

            padding: 10px 18px;

            border-radius: 7px;

            cursor: pointer;

            margin-bottom: 25px;
        }


        @media (max-width: 800px) {

            .form-container {

                grid-template-columns: 1fr;
            }


            .manager-container {

                width: 95%;

                padding: 20px;
            }


            .navbar {

                padding: 0 15px;
            }

        }

    </style>

</head>


<body>


<!-- ================= NAVBAR ================= -->

<div class="navbar">


   <div class="logo">
    <img src="logo.png" alt="Virtual Stock Trading Logo">
</div>


    <h2>
        Stock Manager Dashboard
    </h2>


    <button
        class="logout"
        onclick="logout()">

        Logout

    </button>

</div>


<!-- ================= MAIN ================= -->

<div class="manager-container">


    <button
        class="back-button"
        onclick="window.location.href='admindashboard.html'">

        ← Back to Admin

    </button>


    <h1>
        Stock Manager Dashboard
    </h1>


    <p class="subtitle">

        Add, update and manage simulated stocks.

    </p>


    <!-- ================= ADD STOCK ================= -->

    <div class="add-stock">


        <h2>
            Add New Stock
        </h2>


        <div class="form-container">


            <div class="form-group">

                <label>
                    Stock Name
                </label>


                <input
                    type="text"
                    id="stockName"
                    placeholder="Example: Reliance Ltd">

            </div>


            <div class="form-group">

                <label>
                    Stock Price
                </label>


                <input
                    type="number"
                    id="stockPrice"
                    placeholder="Example: 500">

            </div>


            <button
                class="add-button"
                onclick="addStock()">

                Add Stock

            </button>

        </div>

    </div>


    <!-- ================= STOCK LIST ================= -->

    <div class="stock-table">


        <h2>
            Managed Stocks
        </h2>


        <table>

            <thead>

                <tr>

                    <th>
                        S.No
                    </th>

                    <th>
                        Stock Name
                    </th>

                    <th>
                        Price
                    </th>

                    <th>
                        Actions
                    </th>

                </tr>

            </thead>


            <tbody id="stockTableBody">

            </tbody>

        </table>

    </div>

</div>
<script src="script.js"></script>

<script>

initializeManagedStocks();

showStocks();

</script>

</body>
</html>
