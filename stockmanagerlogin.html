<!DOCTYPE html>
<html lang="en">

<head>

    <title>Virtual Stock Trading - Stock Manager Login</title>

    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            font-family: Arial, sans-serif;

            background:
                linear-gradient(
                    135deg,
                    rgb(136, 10, 194),
                    rgb(65, 20, 100)
                );

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;
        }


        /* ================= LOGIN CONTAINER ================= */

        .login-container {

            width: 400px;

            background-color: white;

            border-radius: 15px;

            padding: 35px;

            text-align: center;

            box-shadow:
                0 10px 30px
                rgba(0, 0, 0, 0.3);
        }


        /* ================= LOGO ================= */

        .logo {

            width: 48px;

            height: 48px;

            margin: 0 auto 15px;

            display: flex;

            align-items: center;

            justify-content: center;

            flex-shrink: 0;
        }


        .logo img {

            width: 48px;

            height: 48px;

            object-fit: contain;

            display: block;
        }


        /* ================= HEADING ================= */

        h1 {

            color:
                rgb(136, 10, 194);

            margin-bottom: 10px;

            font-size: 26px;
        }


        p {

            color: gray;

            margin-bottom: 25px;
        }


        /* ================= INPUT ================= */

        input {

            width: 100%;

            padding: 12px;

            margin-top: 15px;

            border:
                1px solid black;

            border-radius: 6px;

            font-size: 15px;
        }


        /* ================= BUTTON ================= */

        button {

            width: 160px;

            padding: 12px;

            margin-top: 25px;

            background-color:
                rgb(114, 10, 205);

            color: white;

            border:
                1px solid black;

            border-radius: 6px;

            cursor: pointer;

            font-size: 16px;
        }


        button:hover {

            background-color:
                rgb(100, 5, 180);
        }


        /* ================= ERROR ================= */

        .error {

            display: block;

            color: red;

            margin-top: 15px;

            font-size: 14px;
        }


        /* ================= BACK LINK ================= */

        .back-link {

            display: block;

            margin-top: 20px;

            color:
                rgb(136, 10, 194);

            text-decoration: none;
        }


        .back-link:hover {

            text-decoration: underline;
        }

    </style>

</head>


<body>


<!-- ================= LOGIN ================= -->

<div class="login-container">


    <div class="logo">

        <img
            src="logo.png"
            alt="Virtual Stock Trading Logo">

    </div>


    <h1>
        Stock Manager Login
    </h1>


    <p>
        Login to Stock Manager Dashboard
    </p>


    <input
        type="text"
        id="username"
        placeholder="Enter Username">


    <input
        type="password"
        id="password"
        placeholder="Enter Password">


    <span
        id="error"
        class="error">
    </span>


    <button
        type="button"
        onclick="stockManagerLogin()">

        Login

    </button>


    <a
        href="Registration%20page.html"
        class="back-link">

        Back to Registration

    </a>


</div>


<script>


/* ================= SET STOCK MANAGER DETAILS ================= */

if (localStorage.getItem("stockManagerDetails") === null) {

    localStorage.setItem(
        "stockManagerDetails",
        JSON.stringify({
            username: "Ajay",
            password: "2500031698"
        })
    );

}


/* ================= LOGIN FUNCTION ================= */

function stockManagerLogin() {

    var username =
        document.getElementById("username").value.trim();


    var password =
        document.getElementById("password").value;


    var error =
        document.getElementById("error");


    error.innerHTML = "";


    /* Get saved Stock Manager details */

    var savedManager =
        localStorage.getItem("stockManagerDetails");


    if (savedManager === null) {

        error.innerHTML =
            "Stock Manager credentials not found.";

        return;

    }


    var manager =
        JSON.parse(savedManager);


    /* Check username and password */

    if (
        username === manager.username &&
        password === manager.password
    ) {

        localStorage.setItem(
            "stockManagerLoggedIn",
            "true"
        );


        window.location.href =
            "stockmanagerdashboard.html";

    }

    else {

        error.innerHTML =
            "Invalid Stock Manager username or password.";

    }

}

</script>


</body>

</html>
